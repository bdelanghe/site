name: semantic

# lone — bless each rendered post's DOM (semantic HTML + accessibility). The runtime
# member of the contract family (content schemas + brand design tokens + lone semantics).
# Blocking: any error-severity finding fails the build.
on:
  pull_request:
  push:
    branches: [main]
    paths: ["posts/**", "build.mjs", "posts.mjs", "styles.css", "data/**", "semantic/**", "vendor/conformance-kit/gates/semantic/**", ".github/workflows/semantic.yml"]
  workflow_dispatch:

jobs:
  bless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - run: npm ci # installs @bdelanghe/brand (build.mjs reads it from node_modules)
      - name: Vendored conformance-kit hash-pin is intact (this workflow calls build.mjs directly, bypassing npm's prebuild hook)
        run: npm run check:integrity
      - name: Build site
        run: node build.mjs
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2
        with:
          deno-version: v2.x
      # lone comes from JSR (jsr:@bounded-systems/lone), pinned by semantic/deno.lock
      # (the consumer's lock) — no clone, no hand-managed sha. --frozen fails if the
      # lock is stale, so the gate engine is reproducible at the version the committed
      # lock records. The runner is still the vendored, hash-pinned conformance-kit
      # gate, but the IMPORT MAP is now semantic/deno.json, this repo's own: WHICH lone
      # to run is a consumer decision, and the lock that pins it already lived here.
      # It used to be the kit's copy, inside its integrity manifest, so changing the
      # version meant editing a vendored file — the exact drift the hash pin exists to
      # detect — or re-vendoring the kit to change one string.
      # --allow-env: the kit gate reads $SEMANTIC_DIR / $SEMANTIC_SELECTOR (defaults
      # match this site: dist/blog · article).
      # TWO invocations, not one widened $SEMANTIC_DIR. The kit's gate.ts uses
      # Deno.readDir, which does NOT recurse — so pointing it at `dist` would SWAP
      # coverage rather than widen it: it would pick up the nine top-level pages and
      # silently stop blessing the two posts under dist/blog. Same shape as the bug this
      # change exists to fix, so it is worth not repeating.
      - name: lone — bless rendered posts (dist/blog)
        run: deno run --frozen --lock=semantic/deno.lock --allow-read --allow-net --allow-env --config semantic/deno.json vendor/conformance-kit/gates/semantic/gate.ts
      # The nine top-level pages, which have never been blessed. $SEMANTIC_DIR defaults
      # to "dist/blog" and was never set here, so lone's nine validators — including its
      # own reader-view one — only ever ran against the two pages that were never broken.
      # /provenance shipped a <span> narrative that made it unreadable in Reader and this
      # gate was green throughout, because it was not looking. Every page now carries
      # <article class="doc">, so the default selector resolves to the right subject
      # instead of falling back to <body> and dragging page chrome into the subtree.
      - name: lone — bless the top-level pages (dist)
        env:
          SEMANTIC_DIR: dist
        run: deno run --frozen --lock=semantic/deno.lock --allow-read --allow-net --allow-env --config semantic/deno.json vendor/conformance-kit/gates/semantic/gate.ts
