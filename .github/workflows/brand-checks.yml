name: brand-checks

# Gate the site against the shared design + content system (@bdelanghe/brand):
# no hardcoded colours, content tokens, complete meta + agent-readiness, a11y contrast.
# brand's own dev tooling (tools/*.mjs) isn't published to npm — it's CI-internal
# analysis tooling, not a distributable asset — so this job checks out brand's
# source, purely to run those scripts; build.mjs itself still only reads the
# installed package (node_modules/@bdelanghe/brand). bdelanghe/brand isn't
# release-tagged (personal, actively-developed pinning) — checks out main
# directly rather than resolving a version tag.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - run: npm ci # installs @bdelanghe/brand (build.mjs reads it from node_modules)
      - name: Vendored conformance-kit hash-pin is intact (this workflow calls build.mjs directly, bypassing npm's prebuild hook)
        run: npm run check:integrity
      - name: Checkout brand's source (dev tooling only — not published to npm)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: bdelanghe/brand
          ref: main
          path: brand
      - name: Build dist/
        run: node build.mjs
      - name: Known-vuln gate (vendored kit gate — production deps, re-proven)
        run: node vendor/conformance-kit/gates/vuln-gate.mjs
      - name: atomic-copy gate (every visible word on / + /resume is a copy atom)
        run: node scripts/copy-gate.mjs --strict
      - name: No hardcoded colours (all colours are tokens)
        run: node brand/tools/coverage.mjs --colors --check dist
      - name: Content tokens (schema + Gherkin + lint)
        run: node brand/tools/content.mjs --check dist
      - name: Meta + agent-readiness
        run: node brand/tools/meta.mjs --check dist
      - name: Accessibility (WCAG AA contrast + headings)
        run: node brand/tools/a11y.mjs --check dist
      - name: Reader-view gate (Safari/Firefox Reader actually gets the content)
        # Complements the kit's structure-audit below rather than duplicating it. That
        # check is scoped by $STRUCTURE_ARTICLE_PREFIX, which defaults to "blog/" and is
        # never set here — so it only ever ran against the two blog posts, which were
        # never broken. And its bar is "extracted > 200 chars", which /provenance CLEARED
        # at 568 while rendering in Reader as a bare column of sha256 digests.
        #
        # This gate measures COVERAGE (extracted / visible text) across every content
        # page, plus whether the browser will offer the Reader control at all. The
        # /provenance regression scored 0.14; the floor is 0.55.
        run: node scripts/reader-view-gate.mjs dist --strict
      - name: Reader-structure gate (the extracted text is still legible)
        # The companion to the reader-view gate above, which measures COVERAGE — how
        # much text Readability gets. This measures STRUCTURE: whether that text keeps
        # its line breaks once Reader strips the class attributes and applies its own
        # stylesheet. They fail independently, and one was green through the other's
        # outage: / 's Background entries were spans in a grid, so coverage was ~100%
        # while seven employment records rendered as run-on lines. 173 such joins
        # sitewide when this was written.
        run: node scripts/reader-structure-gate.mjs dist
      - name: Reader-links gate (the links inside the text survive too)
        # The third leg, and the one a reader noticed before any gate did: /resume had
        # 94% coverage and clean structure while seven of its fourteen links — every
        # employer and institution — were being culled. Readability drops blocks whose
        # link density is high for their text, and <div> is on its cull list where
        # <section> and <p> are not.
        run: node scripts/reader-links-gate.mjs dist
      - name: Reachability gate (every page has a path to it from /)
        # The complement of structure-audit's link checker below, which finds links
        # pointing at nothing. This finds the opposite — a page nothing points at.
        # /blog and both posts shipped that way after the redesign replaced the
        # homepage link list: still built, still in the sitemap, still in llms.txt,
        # and reachable only by typing the URL. Every gate was green, because a
        # sitemap entry is not a link and llms.txt is not navigation.
        run: node scripts/reachability-gate.mjs dist
      - name: Build the static API (fold-load's API section assesses it)
        # This job builds with plain `node build.mjs`, which writes
        # api/v1/conformance.json but NOT the index that folds it — gen-api.mjs
        # does that. Without this step the gate reported conformance.json as
        # "over budget, no index folds it", which was true of the tree in front of
        # it and false of the site. A gate whose verdict depends on which build
        # step happened to run is measuring the job, not the artifact.
        run: node scripts/gen-api.mjs
      - name: Fold-load gate (a fold is lossless, and a step is within budget)
        # Two properties of the unfold model, checked where they are checkable.
        # FIDELITY: whatever the emitted record drops that the page renders is
        # residue — the Person record was missing seven employers and the degree
        # while /resume showed all of them. TRACTABILITY: a sibling run of choices
        # standing at rest is one expansion step, held to a working-memory budget.
        # Deliberately NOT applied to the record (nobody holds a ld+json in working
        # memory) or to prose (twelve links in a paragraph are read, not scanned) —
        # both would be the category error the gate exists to avoid.
        run: node scripts/fold-load.mjs dist --strict
      - name: Install structure-audit deps (vendored conformance-kit tenant)
        run: npm ci --prefix vendor/conformance-kit/integrity/structure-audit
      - name: Whole-page structure gate (reader survivability + outline + links)
        # The kit's structure-audit is site-agnostic: this site's committed baseline
        # (structure.json) is an INPUT, kept in the consumer via $STRUCTURE_BASELINE
        # (so the hash-pinned kit copy isn't mutated by --check). The link-checker's
        # served-artifact allow-list is config-driven ($STRUCTURE_AUDIT_SIDECARS):
        # these paths are deploy/later-step MACHINE artifacts, not navigational pages,
        # absent from this plain `node build.mjs` — so /conformance's evidence links to
        # them (and /resume.pdf) aren't flagged dead. /provenance.json + /site.sha256
        # are in the kit's default allow-list; the rest are this site's evidence set:
        #   /resume.pdf                         — print-to-pdf at deploy
        #   /attestation.intoto.json(.sigstore) — in-toto/SLSA statement + Sigstore bundle
        #   /sbom.spdx.json(.sigstore)          — SPDX SBOM + Sigstore bundle
        #   /site.sha256.sigstore.json          — signed whole-site manifest bundle
        run: |
          STRUCTURE_AUDIT_SIDECARS=/resume.pdf,/attestation.intoto.json,/attestation.intoto.json.sigstore.json,/sbom.spdx.json,/sbom.spdx.json.sigstore.json,/site.sha256.sigstore.json \
          STRUCTURE_BASELINE=vendor/conformance-kit/integrity/structure-audit/structure.json \
          node vendor/conformance-kit/integrity/structure-audit/audit.mjs dist --check
