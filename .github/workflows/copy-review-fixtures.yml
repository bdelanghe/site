name: copy-review-fixtures

# Regression harness for the copy-review calibration. Runs the severity-anchored
# fixtures (most of them real human catches) through the actual reviewer and asserts
# it still classifies them correctly — PASS fixtures never blocked, FLAG fixtures
# caught at >= their floor.
#
# Manual / on-demand only (workflow_dispatch): one API call per fixture, and an LLM
# judge isn't worth running on every PR. Fails loudly on a real classification
# regression; skips cleanly (exit 0) without an API key.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC → cf-token-broker, for the per-run Anthropic key

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Mint the Anthropic key (broker when configured, stored secret otherwise)
        id: anthropic
        uses: ./.github/actions/broker-anthropic-key
        with:
          broker-url: ${{ vars.CF_BROKER_URL }}
          broker-path: ${{ vars.ANTHROPIC_BROKER_PATH }}
          stored: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Copy-review fixtures
        env:
          ANTHROPIC_API_KEY: ${{ steps.anthropic.outputs.key }}
        run: node copy-review-fixtures.mjs
