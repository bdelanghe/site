name: flake-trial

# TEMPORARY — delete before this branch merges.
#
# The session proposing the tarball input has no nix, so it cannot regenerate
# flake.lock or run `nix build`. This job is the nix. It regenerates the lock for
# the new input, builds the site hermetically, and proves the two brand pins now
# resolve to the same bytes — the property site#274 exists about.
#
# Triggered on push to this branch rather than workflow_dispatch, because a
# dispatchable workflow must exist on the DEFAULT branch to be dispatchable, and
# this one deliberately never will.
#
# `paths:` excludes flake.lock so the commit this job pushes does not retrigger it.

on:
  push:
    branches: [claude/flake-npm-tarball]
    paths:
      - flake.nix
      - .github/workflows/flake-trial.yml

permissions:
  contents: write # commits the regenerated flake.lock back to this branch

jobs:
  trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - run: npm ci

      - name: Regenerate the lock for the tarball input
        run: |
          set -euo pipefail
          nix flake update brand
          echo "--- flake.lock brand node ---"
          node -e 'const n=require("./flake.lock").nodes.brand; console.log(JSON.stringify(n,null,2))'

      - name: Does the store path carry a top-level package/ ?
        # The buildPhase guards both shapes; this records which one nix actually
        # produces, so the guard can be simplified to the true one later.
        run: |
          set -euo pipefail
          p=$(nix eval --raw --impure --expr 'builtins.toString (builtins.getFlake (toString ./.)).inputs.brand')
          echo "store path: $p"
          echo "--- top level ---"
          ls -A "$p"
          if [ -d "$p/package" ]; then echo "SHAPE: tarball root (package/ present)"; else echo "SHAPE: stripped (contents at root)"; fi

      - name: Hermetic build
        run: nix build .#site -L

      - name: Token parity — the whole point
        run: |
          set -euo pipefail
          p=$(nix eval --raw --impure --expr 'builtins.toString (builtins.getFlake (toString ./.)).inputs.brand')
          if [ -d "$p/package" ]; then p="$p/package"; fi
          for f in tokens/tokens.css tokens/tokens.json content/strings.json; do
            cmp "$p/$f" "node_modules/@bdelanghe/brand/$f"
            echo "  identical  $f"
          done
          echo "both pins are now the same artifact"

      - name: The built site is non-empty and carries brand assets
        run: |
          set -euo pipefail
          test -f result/index.html
          ls result/brand >/dev/null
          echo "dist/ built: $(find result -type f | wc -l) files"

      - name: Commit the regenerated lock
        run: |
          set -euo pipefail
          if git diff --quiet flake.lock; then
            echo "flake.lock unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "flake.lock: regenerate for the npm tarball input (via flake-trial)"
          git push
