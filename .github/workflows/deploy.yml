name: deploy

# Two-phase, promote-the-artifact pipeline — stage → approve → sign → release (site#243):
#   build   — hermetic nix build → keyless-sign the build-provenance BLOBS (in-toto/SLSA
#             statement, whole-site manifest, SBOM, résumé VC — Sigstore/Rekor, no held key) →
#             STAGE the site to GHCR as an UNSIGNED, digest-pinned OCI artifact. Staging, not
#             release: the artifact itself carries no signature until a human approves.
#             Site-specific (résumé PDF, scripts) — stays here.
#   deploy  — the CANONICAL reusable pipeline (bounded-systems/.github): pull the staged artifact
#             by this run's own digest, upload an un-served preview version, cryptographically
#             verify that version's own preview URL, then — behind the site-promote gate — mint
#             the artifact's first and only signature and release it to prod. A signature can
#             only exist for an approved artifact: "unsigned" and "unreleased" are the same fact.
#             Fail-closed by construction; one source of truth shared with bounded.tools.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC: lets cosign mint a keyless Fulcio cert for build provenance
  packages: write # push the staged site to GHCR — and the callee's post-approval cosign sign pushes the signature there, so this grant must survive the intersection with the callee's declared block (deploy has no job-level block; this workflow-level grant is what flows through)
  issues: write # the promote ceremony's notification issue (the callee's declared block intersects, so the grant must originate here)

concurrency:
  group: deploy
  # A run stuck waiting at the site-promote approval gate (never approved or
  # rejected) otherwise blocks every subsequent deploy indefinitely — that's
  # exactly what silently queued a real deploy behind a 3-day-old unreviewed
  # one. promote's only prod-affecting step (wrangler versions deploy) is a
  # single atomic Cloudflare routing switch, not a multi-step process that can
  # be left half-applied; cancelling mid-promote can at worst interrupt the
  # post-switch verification (site.sha256/provenance.json check + HTTP probe)
  # for that one run, not corrupt what's already live.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      oci: ${{ steps.publish.outputs.oci }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Build (nix, reproducible)
        run: nix build .#site -L
      - name: Stage dist
        run: cp -rL result dist && chmod -R u+w dist


      # SPDX 2.3 SBOM over the whole supply chain (npm + Nix + brand), then the
      # in-toto/SLSA statement over the hermetic subjects — both keyless-signed
      # (cosign sign-blob → Fulcio cert from the Actions OIDC identity → Rekor). No
      # stored key. gen-sbom runs FIRST so the SBOM is an attestation subject;
      # check-sbom is the fail-closed completeness gate (SBOM ↔ attestation). BEFORE
      # resume.pdf so the statement's subjects stay reproducible. The SBOM blob is
      # signed in the OCI step (after the manifest), so its sidecar stays out of the
      # whole-site manifest like the other provenance sidecars.
      - name: Sign provenance statement + SBOM (keyless Sigstore)
        run: |
          nix develop .#deploy --command bash -euo pipefail -c '
            # gen-attestation.mjs reads @bdelanghe/brand from node_modules
            # (this step runs in the outer checkout, not nix build'\''s isolated
            # sandbox where flake.nix materializes brand/ itself).
            npm ci
            # Static JSON API + OpenAPI and the did:web + résumé Verifiable Credential,
            # emitted BEFORE the manifest so they are covered by site.sha256 like the
            # rest of dist/ (the VC blob is signed after the manifest, below).
            node scripts/gen-api.mjs
            node scripts/gen-identity.mjs
            node scripts/gen-sbom.mjs
            node scripts/gen-attestation.mjs
            node scripts/check-sbom.mjs
            # CSP LAST among the generators: gen-csp hashes the inline blocks of the FINAL
            # HTML, and gen-attestation above rewrites provenance.html. It must be listed
            # here explicitly — this pipeline does NOT run `npm run build` (nix build'\''s
            # buildPhase runs `node build.mjs` alone), so a generator wired only into the
            # npm script never runs on the deploy path. That is exactly how the policy
            # shipped as a no-op the first time. csp-gate then fails the deploy rather than
            # letting a missing or stale policy reach production.
            node scripts/gen-csp.mjs
            node scripts/csp-gate.mjs
            cosign sign-blob --yes \
              --bundle dist/attestation.intoto.json.sigstore.json \
              dist/attestation.intoto.json
          '
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Render static resume PDF (headless Chrome)
        # Rendered from the built page AFTER the in-toto statement: Chrome output
        # is non-deterministic + impure, so it stays out of the hermetic nix build
        # and that statement. It IS covered by the whole-site manifest below (the
        # honest record of the served bytes). Chrome is preinstalled on the runner;
        # a tiny local server lets absolute /brand asset paths resolve.
        run: |
          python3 -m http.server 8099 --directory dist &
          srv=$!
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8099/resume.html >/dev/null 2>&1 && break; sleep 0.5; done
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --no-pdf-header-footer --virtual-time-budget=12000 \
            --print-to-pdf=dist/resume.pdf http://127.0.0.1:8099/resume.html
          kill "$srv" 2>/dev/null || true
          ls -la dist/resume.pdf

      # Content-address the whole served site (resume.pdf included), keyless-sign
      # that manifest, write /provenance.json, then publish the WHOLE dist/ (site
      # + provenance sidecars) to GHCR as one UNSIGNED, digest-pinned OCI artifact.
      # No `cosign sign` of the OCI ref here (site#243): the artifact's first and
      # only signature is minted by the deploy pipeline AFTER the promote gate, so
      # a build that is never approved never acquires one. The blob signatures
      # (in-toto statement, manifest, SBOM, VC) are build provenance and stay.
      - name: Sign provenance blobs + stage the OCI artifact (unsigned → GHCR)
        id: publish
        env:
          GHCR_REPO: ghcr.io/bdelanghe/robertdelanghe-dev
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          nix develop .#deploy --command bash -euo pipefail -c '
            short=$(printf "%s" "$GITHUB_SHA" | cut -c1-7)
            node scripts/gen-sitemanifest.mjs
            cosign sign-blob --yes --bundle dist/site.sha256.sigstore.json dist/site.sha256
            # Keyless-sign the SBOM blob (same Fulcio/Rekor identity). AFTER the
            # manifest: dist/sbom.spdx.json is covered by site.sha256, while its
            # signature sidecar stays out of the manifest, matching the attestation +
            # manifest sidecars. Both ride inside the signed OCI artifact (it is in dist/).
            cosign sign-blob --yes --bundle dist/sbom.spdx.json.sigstore.json dist/sbom.spdx.json
            # Keyless-sign the résumé Verifiable Credential the same way (enveloping
            # Sigstore proof). AFTER the manifest, like the SBOM: resume.vc.json is
            # covered by site.sha256, its signature sidecar stays out of the manifest.
            cosign sign-blob --yes --bundle dist/api/v1/resume.vc.json.sigstore.json dist/api/v1/resume.vc.json
            OCI_REF="$GHCR_REPO:$short" node scripts/gen-provenance.mjs
            # Content-address the served site as an IPFS UnixFS dir CID (no daemon) and
            # record it in provenance.json alongside the manifest digest — AFTER
            # gen-provenance writes that file. Uses the signed site.sha256 file set.
            node vendor/conformance-kit/generators/gen-cid.mjs
            tar --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 -C dist -cf site.tar .
            gzip -n -f site.tar
            printf "%s" "$GITHUB_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            oras push "$GHCR_REPO:$short" \
              --artifact-type application/vnd.robertdelanghe.site.v1+gzip \
              site.tar.gz:application/gzip | tee oras-push.log
            oras tag "$GHCR_REPO:$short" latest
            digest=$(awk "/Digest:/ {print \$2}" oras-push.log)
            echo "oci=$GHCR_REPO@$digest" >> "$GITHUB_OUTPUT"
          '

  # DEPLOY: hand the staged, digest-pinned artifact to the CANONICAL reusable pipeline (preview →
  # cryptographic verify of the version's preview URL → gated promote → post-approval sign →
  # release). The required-reviewers `site-promote` Environment lives in THIS repo, so the human
  # approval gate is enforced here. One source of truth for the deploy machinery:
  # bounded-systems/.github.
  deploy:
    needs: build
    if: needs.build.outputs.oci != ''
    uses: bounded-systems/.github/.github/workflows/site-deploy.yml@d2e102169f941ceb04ad4c33e0686e0d3a2e633b # main, carries deferred_sign (site#243), over #251's Face ID promote gate
    with:
      oci: ${{ needs.build.outputs.oci }}
      domain: "https://robertdelanghe.dev"
      # stage → approve → sign → release (site#243): build stages the artifact
      # UNSIGNED, and promote mints its first and only signature AFTER the human
      # gate — preview runs pre-signature and rests on the run's own digest;
      # promote's release leg keeps full verification of that fresh signature.
      deferred_sign: true
      # The post-approval signer is the gate-holding lane, so the Fulcio identity
      # of the only signature that can exist is site-deploy.yml's own
      # job_workflow_ref — not this repo's build lane.
      identity_regexp: "^https://github.com/bounded-systems/.github/.github/workflows/site-deploy.yml@"
      # Literal URL, not a var: this is a personal repo, bounded-systems org
      # variables do not resolve here. The callee appends -preview / -promote
      # to the broker path per job role.
      cf_broker_url: "https://broker.bounded.tools"
      cf_broker_path: /deploy/bdelanghe-site
      # The promote gate is a Face ID ceremony (bounded-systems/infra#480): the callee
      # opens a ceremony pinning the run and commit, the notification issue carries the
      # verified preview URL, and the promote credential is minted only after a
      # fail-closed redeem. With this set, the site-promote Environment's required
      # reviewers become redundant — removing them is a repo-settings toggle recorded
      # in the PR that added this line.
      keeper_url: "https://keeper.bounded.tools"
